# eval/golden.toml — BỘ QUERY VÀNG để đo chất lượng retrieval.
#
# File này là dữ liệu, KHÔNG phải config: nó định nghĩa "đúng" là gì để
# `llm-wiki eval` tính P@k / R@k / MRR. COMMIT vào wiki repo.
# Kết quả đo nằm ở eval/results.json (gitignored).
#
# Cách lấy query:
#   - Câu hỏi thật mà human đã hỏi trong các phiên (xem `wiki/log.md` + history).
#   - Câu mà wiki TRẢ LỜI SAI/THÔNG TIN THIẾU → giữ lại làm regression test.
#   - 20–50 query là đủ để có tín hiệu; đừng soạn query do đoán.
#
# Quy tắc:
#   - `relevant` = danh sách path concept CHẤP NHẬN ĐƯỢC cho query (binary).
#     Path lấy như trong DB: `wiki/<domain>/<kind>/<slug>.md` — nhưng `.md` và
#     prefix `wiki/` có hay không đều khớp (eval chuẩn hoá 2 phía).
#   - Một query có thể có nhiều concept relevant.
#   - Concept chưa có trong wiki → ĐỪNG cho vào relevant; đó là gap để ingest.
#   - Tránh dấu `:` trong `query`: FTS5 parse `abc:` thành column filter và báo
#     lỗi cú pháp (eval vẫn recover bằng lượt sanitize, nhưng noise không cần thiết).

[[query]]
id = "q01"
query = "reindex incremental quyết định bỏ qua file nào"
relevant = [
    "wiki/retrieval/concept/reindex-incremental.md",
]

[[query]]
id = "q02"
query = "làm sao để một page được coi là human-reviewed"
relevant = [
    "wiki/governance/concept/trust-tier.md",
    "wiki/governance/entity/verify-command.md",
]

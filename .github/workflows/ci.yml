name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .[dev]
      - name: Tests
        run: PYTHONPATH=src python -m pytest tests/ -q
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/llm_wiki_base/registry.py src/llm_wiki_base/cli.py

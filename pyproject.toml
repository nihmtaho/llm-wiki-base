[project]
name = "llm-wiki-base"
version = "0.1.0"
description = "LLM-maintained wiki with hybrid BM25+vector search, MCP bridge, multi-base init (personal/project)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "llm-wiki-base contributors"},
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "mcp>=1.9,<2",
    "fastembed>=0.5",
    "numpy",
    "trafilatura",
    "pymupdf",
    "platformdirs>=4",
    "tomli>=2; python_version < '3.11'",
    "tomli-w>=1",
]

[project.scripts]
llm-wiki-base = "llm_wiki_base.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Narrow gate: real bugs (F), syntax-level pycodestyle (E4/E7/E9),
# import order (I), py310 upgrades (UP). No style rules (E501 etc.).
select = ["F", "E4", "E7", "E9", "I", "UP"]

[tool.mypy]
python_version = "3.10"

# tomllib chỉ có từ 3.11; code đã fallback sang tomli qua try/except ImportError.
[[tool.mypy.overrides]]
module = "tomllib"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki_base"]
include = [
    "src/llm_wiki_base/skills/**",
    "src/llm_wiki_base/templates/**",
]

[project]
name = "llm-wiki"
version = "0.1.0"
description = "LLM-maintained wiki with hybrid BM25+vector search, MCP bridge, multi-base init (personal/project)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "llm-wiki contributors"},
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "mcp>=1.9,<2",
    "fastembed>=0.5",
    "numpy",
    "trafilatura",
    "pymupdf",
    "platformdirs>=4",
    "tomli>=2; python_version < '3.11'",
    "tomli-w>=1",
]

[project.scripts]
llm-wiki = "llm_wiki.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki"]
include = [
    "src/llm_wiki/skills/**",
    "src/llm_wiki/templates/**",
]

[tool.hatch.build.targets.wheel.force-include]
"src/llm_wiki/skills" = "llm_wiki/skills"
"src/llm_wiki/templates" = "llm_wiki/templates"
"src/llm_wiki/base_tools" = "llm_wiki/base_tools"
"src/llm_wiki/base_rag" = "llm_wiki/base_rag"
"src/llm_wiki/base_scripts" = "llm_wiki/base_scripts"
